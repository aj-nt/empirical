name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  go:
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build Swiss Ephemeris from source
        run: |
          set -euo pipefail
          SWE_VERSION="v2.10.3bfinal"
          SWE_PREFIX="$HOME/swe"
          git clone --depth 1 --branch "$SWE_VERSION" https://github.com/aloistr/swisseph.git /tmp/swisseph
          cd /tmp/swisseph
          make libswe.a
          mkdir -p "$SWE_PREFIX/lib" "$SWE_PREFIX/include" "$SWE_PREFIX/lib/pkgconfig"
          cp libswe.a "$SWE_PREFIX/lib/"
          cp *.h "$SWE_PREFIX/include/"
          cat > "$SWE_PREFIX/lib/pkgconfig/swe.pc" <<EOF
          prefix=$SWE_PREFIX
          libdir=\${prefix}/lib
          includedir=\${prefix}/include

          Name: swe
          Description: Swiss Ephemeris (AstroDienst)
          Version: 2.10.03
          Libs: \${libdir}/libswe.a -lm
          Cflags: -I\${includedir}
          EOF
          echo "PKG_CONFIG_PATH=$SWE_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - run: go build -buildvcs=false ./...
      - name: ASAN repro (diagnostic)
        run: |
          set -euo pipefail
          cd /tmp/swisseph
          make clean >/dev/null 2>&1 || true
          make libswe.a CFLAGS="-g -O1 -fsanitize=address -fno-omit-frame-pointer -Wall -fPIC" >/dev/null 2>&1
          SWE_ASAN="$HOME/swe-asan"
          mkdir -p "$SWE_ASAN/lib" "$SWE_ASAN/include" "$SWE_ASAN/lib/pkgconfig"
          cp libswe.a "$SWE_ASAN/lib/"
          cp *.h "$SWE_ASAN/include/"
          printf 'prefix=%s\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\n\nName: swe\nDescription: Swiss Ephemeris (ASAN)\nVersion: 2.10.03\nLibs: ${libdir}/libswe.a -lm -fsanitize=address\nCflags: -I${includedir} -fsanitize=address\n' "$SWE_ASAN" > "$SWE_ASAN/lib/pkgconfig/swe.pc"
          cat "$SWE_ASAN/lib/pkgconfig/swe.pc"
          export PKG_CONFIG_PATH="$SWE_ASAN/lib/pkgconfig"
          export CGO_CFLAGS="-fsanitize=address"
          export CGO_LDFLAGS="-fsanitize=address"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"
          pkg-config --cflags --libs swe
          cd /home/runner/work/empirical/empirical
          go test ./cmd/recover/ -run TestTransitSubcommand_JSON -count=1 2>&1 | tail -100
      - run: go test ./...
      - run: go vet ./...
