name: Feature Request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: What would you like?
      description: Describe the feature or improvement you'd like to see.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Why is this valuable?
      description: Explain why this would be useful for the project or its users.