<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empirical Astrology</title>
<style>
:root {
  --bg: #0d1117;
  --surface: #161b22;
  --border: #30363d;
  --text: #c9d1d9;
  --muted: #8b949e;
  --accent: #58a6ff;
  --green: #3fb950;
  --red: #f85149;
  --yellow: #d2991d;
  --purple: #a371f7;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.5; padding: 20px;
}
h1 { font-size: 1.5rem; margin-bottom: 20px; color: var(--accent); }
h2 { font-size: 1.1rem; margin: 16px 0 8px; color: var(--text); }
h3 { font-size: 0.95rem; margin: 12px 0 4px; color: var(--muted); }
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 16px; margin-bottom: 16px;
}
.grid { display: grid; gap: 12px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: 1fr 1fr 1fr; }
label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 2px; }
input, select, button {
  background: var(--bg); color: var(--text); border: 1px solid var(--border);
  border-radius: 4px; padding: 6px 10px; font-size: 0.85rem; width: 100%;
}
input:focus, select:focus { border-color: var(--accent); outline: none; }
button {
  background: var(--accent); color: #fff; border: none;
  cursor: pointer; font-weight: 600; margin-top: 12px;
}
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  padding: 6px 14px; border: 1px solid var(--border); border-radius: 6px;
  cursor: pointer; font-size: 0.85rem; color: var(--muted);
  background: var(--surface);
}
.tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.tab:hover:not(.active) { border-color: var(--muted); }
pre {
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 4px; padding: 12px; overflow-x: auto;
  font-size: 0.8rem; white-space: pre-wrap; max-height: 400px; overflow-y: auto;
}
.chart-svg { max-width: 100%; height: auto; }
.chart-svg svg { max-width: 100%; height: auto; }
.score-bar {
  display: inline-block; height: 8px; border-radius: 4px;
  background: var(--border); min-width: 60px;
}
.score-fill { height: 100%; border-radius: 4px; }
.score-good { background: var(--green); }
.score-bad { background: var(--red); }
.score-neutral { background: var(--yellow); }
.tag {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 0.75rem; margin: 2px;
}
.tag-good { background: #1a3a1a; color: var(--green); }
.tag-bad { background: #3a1a1a; color: var(--red); }
.tag-info { background: #1a1a3a; color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--muted); font-weight: 600; }
tr:hover { background: rgba(255,255,255,0.03); }
.loading { color: var(--yellow); font-style: italic; }
.error { color: var(--red); }
@media (max-width: 768px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<h1>Empirical Astrology</h1>

<div class="card">
  <h2>Chart Data</h2>
  <div class="grid grid-3">
    <div><label>Name</label><input id="name" value="AJ"></div>
    <div><label>Year</label><input id="year" type="number" value="1969"></div>
    <div><label>Month</label><input id="month" type="number" value="2" min="1" max="12"></div>
    <div><label>Day</label><input id="day" type="number" value="15" min="1" max="31"></div>
    <div><label>Hour</label><input id="hour" type="number" value="23" min="0" max="23"></div>
    <div><label>Minute</label><input id="minute" type="number" value="10" min="0" max="59"></div>
    <div><label>TZ Offset</label><input id="tz" type="number" value="-8" step="0.5"></div>
    <div><label>Latitude</label><input id="lat" type="number" value="47.038" step="0.001"></div>
    <div><label>Longitude</label><input id="lng" type="number" value="-122.901" step="0.001"></div>
    <div><label>House System</label><select id="hsys">
      <option value="P">Placidus</option><option value="W">Whole Sign</option>
      <option value="K">Koch</option><option value="E">Equal</option>
    </select></div>
    <div><label>Orb (degrees)</label><input id="orb" type="number" value="3" step="0.5"></div>
    <div><label>Age (for directions)</label><input id="age" type="number" value="57.33" step="0.01"></div>
  </div>
  <button onclick="loadAll()">Load Chart</button>
  <span id="status"></span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('chart')">Chart</div>
  <div class="tab" onclick="switchTab('interpretation')">Interpretation</div>
  <div class="tab" onclick="switchTab('aspects')">Aspects & Patterns</div>
  <div class="tab" onclick="switchTab('transits')">Transits</div>
  <div class="tab" onclick="switchTab('directions')">Directions</div>
  <div class="tab" onclick="switchTab('astrocartography')">Astrocartography</div>
  <div class="tab" onclick="switchTab('electional')">Electional</div>
</div>

<div id="tab-chart" class="tab-content"></div>
<div id="tab-interpretation" class="tab-content" style="display:none"></div>
<div id="tab-aspects" class="tab-content" style="display:none"></div>
<div id="tab-transits" class="tab-content" style="display:none"></div>
<div id="tab-directions" class="tab-content" style="display:none"></div>
<div id="tab-astrocartography" class="tab-content" style="display:none"></div>
<div id="tab-electional" class="tab-content" style="display:none"></div>

<script>
const API = '';

function bd() {
  return {
    name: $('#name').value,
    year: +$('#year').value, month: +$('#month').value, day: +$('#day').value,
    hour: +$('#hour').value, minute: +$('#minute').value,
    tz_offset: +$('#tz').value, lat: +$('#lat').value, lng: +$('#lng').value,
  };
}

function $(id) { return document.getElementById(id); }

async function post(path, body) {
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(`${r.status}: ${await r.text()}`);
  return r;
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.style.display = 'none');
  document.querySelector(`.tab:nth-child(${
    ['chart','interpretation','aspects','transits','directions','astrocartography','electional']
    .indexOf(name) + 1})`).classList.add('active');
  $(`tab-${name}`).style.display = 'block';
}

async function loadAll() {
  const s = $('#status'); s.textContent = 'Loading...'; s.className = 'loading';
  try {
    await Promise.all([
      loadChart(), loadInterpretation(), loadAspects(),
      loadTransits(), loadDirections(), loadAstrocartography(), loadElectional(),
    ]);
    s.textContent = 'Done'; s.className = '';
  } catch(e) {
    s.textContent = e.message; s.className = 'error';
  }
}

async function loadChart() {
  const body = {...bd(), house_system: $('#hsys').value, sidereal: false,
    show_aspects: true, outer_planets: true, highlight_patterns: true, pattern_orb: +$('#orb').value};
  const r = await post('/api/chart', body);
  const svg = await r.text();
  $('#tab-chart').innerHTML = `<div class="card"><div class="chart-svg">${svg}</div></div>`;
}

async function loadInterpretation() {
  const body = {...bd(), house_system: $('#hsys').value, orb: +$('#orb').value};
  const r = await post('/api/interpretation', body);
  const d = await r.json();
  let html = '<div class="card"><h2>Planets in Signs</h2>';
  for (const s of d.planet_signs) html += `<div style="margin:4px 0;font-size:0.85rem">${s}</div>`;
  html += '</div><div class="card"><h2>Planets in Houses</h2>';
  for (const s of d.planet_houses) html += `<div style="margin:4px 0;font-size:0.85rem">${s}</div>`;
  html += '</div><div class="card"><h2>Aspects</h2>';
  for (const s of d.aspects) html += `<div style="margin:4px 0;font-size:0.85rem">${s}</div>`;
  html += '</div><div class="card"><h2>Patterns</h2>';
  for (const s of d.patterns) html += `<div style="margin:4px 0;font-size:0.85rem">${s}</div>`;
  html += '</div>';
  $('#tab-interpretation').innerHTML = html;
}

async function loadAspects() {
  const body = {...bd(), orb: +$('#orb').value};
  const [ar, pr] = await Promise.all([
    post('/api/aspects', {}).then(r => r.json()),
    post('/api/patterns', body).then(r => r.json()),
  ]);
  let html = '<div class="card"><h2>Aspect Catalog</h2><table>';
  for (const a of ar) {
    html += `<tr><td>${a.Name}</td><td>${a.AngleDegrees}°</td><td>${a.Universality}</td></tr>`;
  }
  html += '</table></div>';
  html += '<div class="card"><h2>Detected Patterns</h2>';
  if (pr.patterns) {
    for (const p of pr.patterns) {
      html += `<div style="margin:4px 0"><strong>${p.name}</strong>: ${p.planets.join(', ')} — ${p.description}</div>`;
    }
  }
  html += '</div>';
  $('#tab-aspects').innerHTML = html;
}

async function loadTransits() {
  const now = new Date();
  const start = now.toISOString().slice(0,10);
  const end = new Date(now.getTime() + 30*86400000).toISOString().slice(0,10);
  const body = {...bd(), start_date: start, end_date: end, orb: +$('#orb').value, sidereal: false};
  const r = await post('/api/transits', body);
  const d = await r.json();
  let html = `<div class="card"><h2>Transits: ${start} to ${end}</h2>`;
  if (d.hits && d.hits.length > 0) {
    html += '<table><tr><th>Date</th><th>Transit</th><th>Natal</th><th>Aspect</th><th>Orb</th></tr>';
    for (const h of d.hits.slice(0, 50)) {
      html += `<tr><td>${h.date||''}</td><td>${h.transit_planet}</td><td>${h.natal_planet}</td><td>${h.aspect}</td><td>${h.orb}°</td></tr>`;
    }
    html += '</table>';
  } else {
    html += '<p>No transits found in this range.</p>';
  }
  html += '</div>';
  $('#tab-transits').innerHTML = html;
}

async function loadDirections() {
  const body = {...bd(), age: +$('#age').value, orb: +$('#orb').value};
  const r = await post('/api/directions', body);
  const d = await r.json();
  let html = `<div class="card"><h2>Primary Directions (Age ${d.age_years})</h2>`;
  html += `<p>Directed ASC: ${d.directed_asc.toFixed(2)}° | Directed MC: ${d.directed_mc.toFixed(2)}°</p>`;
  html += '<h3>ASC Aspects</h3><table><tr><th>Planet</th><th>Aspect</th><th>Orb</th></tr>';
  for (const h of d.asc_aspects) html += `<tr><td>${h.natal_planet}</td><td>${h.aspect}</td><td>${h.orb}°</td></tr>`;
  html += '</table><h3>MC Aspects</h3><table><tr><th>Planet</th><th>Aspect</th><th>Orb</th></tr>';
  for (const h of d.mc_aspects) html += `<tr><td>${h.natal_planet}</td><td>${h.aspect}</td><td>${h.orb}°</td></tr>`;
  html += '</table></div>';
  $('#tab-directions').innerHTML = html;
}

async function loadAstrocartography() {
  const body = {...bd(), lat_step: 10, frame: 'tropical'};
  const r = await post('/api/astrocartography', body);
  const d = await r.json();
  let html = `<div class="card"><h2>Astrocartography (Tropical, GMST ${d.gmst.toFixed(2)}°)</h2>`;
  html += '<table><tr><th>Planet</th><th>Angle</th><th>Points</th><th>Sample Lon</th></tr>';
  for (const l of d.lines) {
    const mid = l.points[Math.floor(l.points.length/2)];
    html += `<tr><td>${l.planet}</td><td>${l.angle}</td><td>${l.points.length}</td><td>${mid.lon.toFixed(1)}°</td></tr>`;
  }
  html += '</table></div>';
  $('#tab-astrocartography').innerHTML = html;
}

async function loadElectional() {
  const now = new Date();
  const start = now.toISOString().slice(0,10);
  const end = new Date(now.getTime() + 14*86400000).toISOString().slice(0,10);
  const body = {...bd(), start_date: start, end_date: end, orb: +$('#orb').value};
  const r = await post('/api/electional', body);
  const d = await r.json();
  let html = `<div class="card"><h2>Electional: ${start} to ${end}</h2>`;
  html += '<table><tr><th>Date</th><th>Day</th><th>Score</th><th>Moon</th><th>Mercury</th><th>Good</th><th>Bad</th></tr>';
  for (const s of d.results) {
    const cls = s.score >= 4 ? 'score-good' : s.score >= 2 ? 'score-neutral' : 'score-bad';
    html += `<tr><td>${s.date}</td><td>${s.day}</td><td><span class="score-bar"><span class="score-fill ${cls}" style="width:${Math.max(10,(s.score+4)*12)}%"></span></span> ${s.score}</td>`;
    html += `<td>${s.moon_sign} H${s.moon_house}</td><td>${s.merc_sign}</td>`;
    html += `<td>${s.good.map(g => `<span class="tag tag-good">${g}</span>`).join(' ')}</td>`;
    html += `<td>${s.bad.map(b => `<span class="tag tag-bad">${b}</span>`).join(' ')}</td></tr>`;
  }
  html += '</table></div>';
  $('#tab-electional').innerHTML = html;
}

// Load on page ready
loadAll();
</script>
</body>
</html>
