<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empirical Astrology</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #c9d1d9; --muted: #8b949e;
    --signal: #3fb950; --noise: #f85149; --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.6; min-height: 100vh; }
  .container { max-width: 720px; margin: 0 auto; padding: 2rem 1rem; }
  header { text-align: center; margin-bottom: 2rem; }
  header h1 { font-size: 1.6rem; font-weight: 600; }
  header p { color: var(--muted); font-size: 0.9rem; }
  .empty { text-align: center; color: var(--muted); padding: 3rem; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Empirical Astrology</h1>
    <p>Cross-system signal recovery — deterministic, falsifiable</p>
  </header>
  <div class="empty">Coming soon. <a href="https://github.com/aj-nt/empirical" style="color:var(--accent)">github.com/aj-nt/empirical</a></div>
</div>
</body>
</html>
